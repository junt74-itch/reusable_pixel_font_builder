[project]
name = "ts-making-pixel-font"
version = "0.1.0"
license = { file = "LICENSE" }
description = "Build deterministic monochrome bitmap font atlases from embedded-bitmap TrueType fonts."
requires-python = ">=3.11"
dependencies = [
  "fonttools>=4.59,<5",
  "pillow>=11,<13",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
